services:
  - type: web
    name: news-radar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: npm run db:migrate --workspace @radar/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: news-radar-db
          property: connectionString
      - key: SEARCH_API_KEY
        sync: false
      - key: SEARCH_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: MAX_SOURCE_CONTENT_BYTES
        value: "500000"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: news-radar-db
    databaseName: radar
    user: radar
